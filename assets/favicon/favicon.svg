<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Gradient for outer petals -->
    <linearGradient id="outerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#166534" />
    </linearGradient>
    
    <!-- Gradient for inner petals -->
    <linearGradient id="innerGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#86efac" />
    </linearGradient>
    
    <!-- Gradient for central leaf/petal -->
    <linearGradient id="centerGrad" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#bbf7d0" />
    </linearGradient>
    
    <!-- Shadow filter for depth -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Base background (transparent for favicon) -->
  <rect width="512" height="512" fill="transparent"/>

  <g transform="translate(256, 380)" filter="url(#dropShadow)">
    
    <!-- Outer Left Petal -->
    <path d="M 0 0 C -180 -20 -240 -160 -180 -260 C -120 -200 -40 -100 0 0 Z" fill="url(#outerGrad)" />
    
    <!-- Outer Right Petal -->
    <path d="M 0 0 C 180 -20 240 -160 180 -260 C 120 -200 40 -100 0 0 Z" fill="url(#outerGrad)" />
    
    <!-- Inner Left Petal -->
    <path d="M 0 0 C -120 -80 -140 -220 -80 -310 C -40 -200 -20 -100 0 0 Z" fill="url(#innerGrad)" />
    
    <!-- Inner Right Petal -->
    <path d="M 0 0 C 120 -80 140 -220 80 -310 C 40 -200 20 -100 0 0 Z" fill="url(#innerGrad)" />
    
    <!-- Center Petal/Leaf -->
    <path d="M 0 0 C -50 -150 -50 -300 0 -360 C 50 -300 50 -150 0 0 Z" fill="url(#centerGrad)" />
    
    <!-- Bottom Base/Stem -->
    <path d="M -20 0 Q 0 40 20 0 Z" fill="#14532d" />
  </g>
</svg>
