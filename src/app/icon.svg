<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F382C" />
      <stop offset="100%" stop-color="#061F17" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-opacity="0.3" />

  <g transform="translate(256, 256)" filter="url(#glow)">
    <!-- Central Ayurvedic Leaf (Right Wing) -->
    <path d="M 0 -130 C 120 -110 170 10 0 140 C -10 10 20 -110 0 -130 Z" fill="url(#emeraldGrad)" opacity="0.9" />
    
    <!-- Central Ayurvedic Leaf (Left Wing) -->
    <path d="M 0 -130 C -120 -110 -170 10 0 140 C 10 10 -20 -110 0 -130 Z" fill="url(#goldGrad)" opacity="0.95" />

    <!-- Stem & Midrib Line -->
    <path d="M 0 -130 Q -10 20 0 160" fill="none" stroke="#FFF" stroke-width="8" stroke-linecap="round" opacity="0.7" />

    <!-- 4-Point Vitality Sparkle Star at Top -->
    <path d="M 0 -170 Q 0 -140 30 -140 Q 0 -140 0 -110 Q 0 -140 -30 -140 Q 0 -140 0 -170 Z" fill="url(#goldGrad)" />
  </g>
</svg>
